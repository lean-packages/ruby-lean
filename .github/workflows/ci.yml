name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.6", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Run test suite
        run: bundle exec rake test || rake test
      - name: Self-lint with ruby-lean
        run: bundle exec rake lint || rake lint
      - name: Build gem package
        run: gem build ruby-lean.gemspec
      - name: Smoke test installed gem
        run: |
          gem install ./ruby-lean-*.gem
          ruby-lean --version
          ruby-lean --help
          ruby-lean lint . --strict
