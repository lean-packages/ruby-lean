name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish Gem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run test suite
        run: bundle exec rake test || rake test

      - name: Self-lint with ruby-lean
        run: bundle exec rake lint || rake lint

      - name: Build gem package
        run: gem build ruby-lean.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: %s\n" "$GEM_HOST_API_KEY" > $HOME/.gem/credentials
          gem push ruby-lean-*.gem
